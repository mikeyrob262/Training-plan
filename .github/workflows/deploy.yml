name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install wrangler@4.111.0 --save-dev
      # STAMP THE BUILD. Fails closed: if the placeholder is gone, the stamp has silently stopped
      # being applied, and an un-stamped deploy is exactly the condition that makes a stale tab
      # indistinguishable from a broken fix. Better to block the deploy than to ship a lie.
      - name: Stamp the build
        run: |
          if ! grep -q "__BUILD_STAMP__" worker.js; then
            echo "::error::worker.js has no __BUILD_STAMP__ placeholder - window.__BUILD__ would ship stale"
            exit 1
          fi
          STAMP="$(date -u +%Y-%m-%dT%H:%MZ)-${GITHUB_SHA:0:7}"
          sed -i "s/__BUILD_STAMP__/$STAMP/" worker.js
          echo "build stamped: $STAMP"
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0996d179ba188c6786583dd4528dc899
      # DID THE EDGE ACTUALLY TAKE IT? A green wrangler deploy does not answer that, and twice it has
      # been wrong: 369e4af deployed clean while the live URL served the previous commit for 65+ polls,
      # and for an unknown stretch before 2026-08-21 a second Cloudflare-native Git integration raced
      # this workflow on every push and served correct code carrying the unstamped placeholder. Both
      # failures are invisible from this job's own conclusion, so the check has to read the EDGE. It
      # runs AFTER the deploy and cannot block it — it reports, on the one signal that identifies a
      # build: the stamp substituted above, which ends in this commit's short sha.
      - name: Verify the edge serves this commit
        run: node scripts/deploy-stamp-verify.mjs "$GITHUB_SHA"
        env:
          GITHUB_SHA: ${{ github.sha }}
